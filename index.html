<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HM Craft — Handmade from home</title>
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1224" />
    <meta
      name="description"
      content="Design your own bracelets, necklaces, mugs, apparel, cases, stickers and gifts. Handmade and delivered to your door."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Manrope:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/hero.jpg" />
    <script>
      // One canonical origin, https://hm-craft.com: Google Sign-In only works on the origins
      // registered for the Web OAuth client, and never on plain http. The server redirects too
      // (public/.htaccess); this covers a server that hasn't loaded those rules.
      (function () {
        var host = location.hostname.toLowerCase();
        if ((host === "hm-craft.com" || host === "www.hm-craft.com") && (location.protocol !== "https:" || host !== "hm-craft.com")) {
          location.replace("https://hm-craft.com" + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <!-- Light mode is switched off for now (see src/theme.tsx).
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        if (localStorage.getItem("homecreator-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
